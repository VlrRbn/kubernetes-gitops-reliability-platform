apiVersion: v1
kind: Pod
metadata:
  name: unsafe-security-context-pod
  namespace: dev
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: Unconfined
  containers:
    - name: app
      image: ghcr.io/example/app@sha256:1111111111111111111111111111111111111111111111111111111111111111
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: true
        capabilities:
          add:
            - NET_RAW
          drop:
            - ALL
        readOnlyRootFilesystem: true
