name: Secure image pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secure-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  HELM_VERSION: v3.21.3
  TRIVY_VERSION: v0.73.0
  SYFT_VERSION: v1.50.0
  COSIGN_VERSION: v3.1.3
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  checks:
    name: Application and chart checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Run project checks
        run: make check

      - name: Verify immutable environment images
        run: ./scripts/verify-environment-images.sh

  image:
    name: Build, scan, and inventory image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Derive immutable image reference
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "ref=ghcr.io/${repository}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: ${{ env.TRIVY_VERSION }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ github.sha }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Export reviewed image
        run: docker save --output "${RUNNER_TEMP}/reliability-demo.tar" "${{ steps.image.outputs.ref }}"

      - name: Upload reviewed image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ github.sha }}
          path: ${{ runner.temp }}/reliability-demo.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish reviewed image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Derive immutable image reference
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "ref=ghcr.io/${repository}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download reviewed image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load reviewed image
        run: docker load --input "${RUNNER_TEMP}/reliability-demo.tar"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Publish immutable image
        id: push
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          push_output="$(docker push "$IMAGE_REF")"
          printf '%s\n' "$push_output"
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' <<< "$push_output" | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Registry did not return a valid image digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign published image identity
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REPOSITORY,,}@${IMAGE_DIGEST}"

      - name: Verify published image signature
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/secure-image.yml@refs/heads/main
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "${IMAGE_REPOSITORY,,}@${IMAGE_DIGEST}" \
            > cosign-verification.json
          jq --exit-status 'length > 0' cosign-verification.json >/dev/null

      - name: Record published identity
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "\`${IMAGE_REF}@${IMAGE_DIGEST}\`"
            echo
            echo "Keyless signature verified for the repository workflow identity."
          } >> "$GITHUB_STEP_SUMMARY"
