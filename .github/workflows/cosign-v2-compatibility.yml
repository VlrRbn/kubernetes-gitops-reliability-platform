name: Cosign v2 Kyverno compatibility

on:
  push:
    branches:
      - test/cosign-v2-compatibility

permissions:
  contents: read

concurrency:
  group: cosign-v2-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  COSIGN_VERSION: v2.6.5

jobs:
  signatures:
    name: Publish isolated Cosign v2 test images
    if: github.repository == 'VlrRbn/kubernetes-gitops-reliability-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign v2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Build and publish isolated test images
        id: images
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          repository="${IMAGE_REPOSITORY,,}"
          signed_ref="${repository}:cosign-v2-signed-${GITHUB_SHA}"
          unsigned_ref="${repository}:cosign-v2-unsigned-${GITHUB_SHA}"

          docker build \
            --build-arg VERSION="cosign-v2-signed-${GITHUB_SHA}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --tag "$signed_ref" \
            ./app
          docker build \
            --build-arg VERSION="cosign-v2-unsigned-${GITHUB_SHA}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --tag "$unsigned_ref" \
            ./app

          signed_output="$(docker push "$signed_ref")"
          unsigned_output="$(docker push "$unsigned_ref")"
          printf '%s\n' "$signed_output"
          printf '%s\n' "$unsigned_output"

          signed_digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' <<< "$signed_output" | tail -n 1)"
          unsigned_digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' <<< "$unsigned_output" | tail -n 1)"
          [[ "$signed_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$unsigned_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$signed_digest" != "$unsigned_digest" ]]

          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "signed_digest=$signed_digest" >> "$GITHUB_OUTPUT"
          echo "unsigned_digest=$unsigned_digest" >> "$GITHUB_OUTPUT"

      - name: Sign exact test digest with Cosign v2
        env:
          IMAGE_REPOSITORY: ${{ steps.images.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.images.outputs.signed_digest }}
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Verify signed test digest
        env:
          IMAGE_REPOSITORY: ${{ steps.images.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.images.outputs.signed_digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/cosign-v2-compatibility.yml@refs/heads/test/cosign-v2-compatibility
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            > cosign-v2-verification.json
          jq --exit-status 'length > 0' cosign-v2-verification.json >/dev/null

      - name: Prove unsigned test digest is rejected
        env:
          IMAGE_REPOSITORY: ${{ steps.images.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.images.outputs.unsigned_digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/cosign-v2-compatibility.yml@refs/heads/test/cosign-v2-compatibility
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          if cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"; then
            echo "Unsigned test digest was unexpectedly accepted" >&2
            exit 1
          fi
          echo "Unsigned test digest was rejected as expected"

      - name: Record compatibility evidence
        env:
          IMAGE_REPOSITORY: ${{ steps.images.outputs.repository }}
          SIGNED_DIGEST: ${{ steps.images.outputs.signed_digest }}
          UNSIGNED_DIGEST: ${{ steps.images.outputs.unsigned_digest }}
        run: |
          {
            echo "### Cosign v2.6.5 compatibility evidence"
            echo
            echo "Signed: \`${IMAGE_REPOSITORY}@${SIGNED_DIGEST}\`"
            echo
            echo "Unsigned: \`${IMAGE_REPOSITORY}@${UNSIGNED_DIGEST}\`"
            echo
            echo "Cosign accepted the signed digest and rejected the unsigned digest."
          } >> "$GITHUB_STEP_SUMMARY"
