crds:
  enabled: true

defaultRules:
  create: false

alertmanager:
  enabled: true
  tplConfig: true
  stringConfig: |
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - namespace
      group_wait: 1s
      group_interval: 1m
      repeat_interval: 4h
      receiver: reliability-demo-dev
    receivers:
      - name: reliability-demo-dev
        webhook_configs:
          - url: http://reliability-demo.dev.svc.cluster.local/
            send_resolved: true
  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.34.0
      sha: 690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    automountServiceAccountToken: false
    retention: 6h
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.2.0
    sha: 3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
  initChownData:
    enabled: false
  persistence:
    enabled: false
  serviceAccount:
    create: true
    automountServiceAccountToken: false
  automountServiceAccountToken: false
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
  serviceMonitor:
    enabled: false
  testFramework:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          isDefault: true
          editable: false
          jsonData:
            httpMethod: POST
            timeInterval: 30s
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: reliability-platform
          orgId: 1
          folder: Reliability Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: reliability-demo-slo-dashboard
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

kubeApiServer:
  enabled: false

kubelet:
  enabled: false

kubeControllerManager:
  enabled: false

coreDns:
  enabled: false

kubeDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: true
    failurePolicy: Fail
    timeoutSeconds: 10
    patch:
      enabled: true
      image:
        registry: ghcr.io
        repository: jkroepke/kube-webhook-certgen
        tag: 1.8.8
        sha: cd85a621724cd9043a5b46a784578fa159437712f920166389fce830554e1c44
  serviceMonitor:
    selfMonitor: false
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    tag: v0.93.1
    sha: e52bb28fd41c98dd407c7a8cba8bdcfe7eabd7447e250afaf1fe7bb816dedbff
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: v0.93.1
      sha: 428f088fe6fe07ab138bda92113664b04848a1dc408e4d3680a60ecdb55d1a65
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus:
  enabled: true
  serviceMonitor:
    selfMonitor: false
  prometheusSpec:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.14.0-distroless
      sha: 50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
    retention: 6h
    scrapeInterval: 30s
    scrapeTimeout: 10s
    evaluationInterval: 30s
    enableAdminAPI: false
    disableAlerting: false
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        observability.reliability-platform.io/monitor: "true"
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - dev
            - stage
            - prod
    ruleSelectorNilUsesHelmValues: false
    ruleSelector:
      matchLabels:
        observability.reliability-platform.io/rules: "true"
    ruleNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
