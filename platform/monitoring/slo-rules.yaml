apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: reliability-demo-slos
  namespace: monitoring
  labels:
    observability.reliability-platform.io/rules: "true"
spec:
  groups:
    - name: reliability-demo.slo.recording
      interval: 30s
      rules:
        - record: reliability_demo:http_requests:rate5m
          expr: sum by (namespace) (rate(reliability_demo_http_requests_total[5m]))
        - record: reliability_demo:http_errors:rate5m
          expr: sum by (namespace) (rate(reliability_demo_http_requests_total{code=~"5.."}[5m]))
        - record: reliability_demo:http_availability:ratio5m
          expr: 1 - (reliability_demo:http_errors:rate5m / reliability_demo:http_requests:rate5m)
        - record: reliability_demo:http_request_duration:p95_5m
          expr: histogram_quantile(0.95, sum by (namespace, le) (rate(reliability_demo_http_request_duration_seconds_bucket[5m])))
    - name: reliability-demo.slo.alerts
      interval: 30s
      rules:
        - alert: ReliabilityDemoAvailabilitySLOBreach
          expr: reliability_demo:http_availability:ratio5m < 0.99 and on (namespace) reliability_demo:http_requests:rate5m > 0.01
          for: 10m
          labels:
            severity: warning
            slo: availability
          annotations:
            summary: Reliability demo availability is below 99%
            description: The 5-minute availability ratio in {{ $labels.namespace }} has remained below the 99% objective for 10 minutes.
        - alert: ReliabilityDemoLatencySLOBreach
          expr: reliability_demo:http_request_duration:p95_5m > 0.5 and on (namespace) reliability_demo:http_requests:rate5m > 0.01
          for: 10m
          labels:
            severity: warning
            slo: latency
          annotations:
            summary: Reliability demo p95 latency is above 500 ms
            description: The 5-minute p95 latency in {{ $labels.namespace }} has remained above 500 ms for 10 minutes.
